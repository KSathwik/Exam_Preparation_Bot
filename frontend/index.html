<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Prep Bot</title>

<script>
  // Blocking (runs before CSS paints) so there's no flash of the wrong theme.
  (function () {
    try {
      var stored = localStorage.getItem("examPrepTheme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    } catch (e) {}
  })();
</script>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.18/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css" id="hljsLightTheme">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css" id="hljsDarkTheme" disabled>
<link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

<div class="app-shell">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="logo-mark" aria-hidden="true">E</span>
      <span>Exam Prep Bot</span>
    </div>

    <button type="button" class="new-chat-btn" id="newChatBtn">
      <span aria-hidden="true">+</span> New Chat
    </button>

    <div class="sidebar-search">
      <input type="search" id="conversationSearch" placeholder="Search chats" aria-label="Search conversations">
    </div>

    <ul class="conversation-list" id="conversationList" aria-label="Conversation history"></ul>

    <div class="sidebar-ai-hub" id="sidebarAiHub" aria-label="AI Hub"></div>

    <div class="sidebar-footer">
      <button type="button" class="sidebar-footer-btn" id="settingsBtn">⚙ Settings</button>
      <div class="user-profile-placeholder">
        <span class="avatar" aria-hidden="true">G</span> Guest
      </div>
    </div>
  </nav>

  <main class="chat-column" id="chatColumn">
    <div class="mobile-topbar">
      <button type="button" id="sidebarToggleBtn" aria-label="Toggle conversation history">☰</button>
      <strong>Exam Prep Bot</strong>
    </div>

    <div class="messages-box" id="messagesBox" role="log" aria-live="polite" aria-label="Conversation"></div>

    <button type="button" class="jump-to-latest" id="jumpToLatestBtn" hidden>↓ Jump to latest</button>

    <form class="composer" id="composerForm">
      <input type="file" id="fileInput" accept=".pdf,.docx" hidden aria-label="Choose a document file to upload">
      <div class="composer-inner">
        <button type="button" class="composer-icon-btn" id="attachBtn" title="Attach a document" aria-label="Attach a document">📎</button>
        <button type="button" class="composer-icon-btn" id="voiceBtn" title="Voice input (coming soon)" aria-label="Voice input, coming soon" disabled>🎤</button>
        <textarea id="queryInput" rows="1" maxlength="1000" placeholder="Ask a question about your materials…" aria-label="Ask a question about your materials"></textarea>
        <span class="char-count" id="charCount" hidden></span>
        <button type="submit" class="composer-icon-btn" id="sendBtn" title="Send" aria-label="Send question">➤</button>
      </div>
    </form>
  </main>

</div>

<dialog id="settingsModal">
  <div class="settings-header">
    <h2>Settings</h2>
    <button type="button" class="settings-close-btn" id="closeSettingsBtn" aria-label="Close settings">✕</button>
  </div>
  <div class="settings-body">
    <div class="settings-section">
      <h3>Appearance</h3>
      <div class="segmented-control" id="themeControl" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system">System</button>
        <button type="button" data-theme-choice="light">Light</button>
        <button type="button" data-theme-choice="dark">Dark</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>About</h3>
      <div class="settings-stats" id="settingsAbout">
        Exam Prep Bot — an intelligent study assistant powered by Claude AI.
      </div>
      <details class="dev-options" id="devOptions">
        <summary>Developer options</summary>
        <div class="dev-options-content">
          <input type="password" id="apiKeyInput" placeholder="X-API-Key override">
          <button type="button" class="btn btn-primary" id="saveKeyBtn">Save</button>
        </div>
        <div class="settings-stats" id="settingsStats">Loading…</div>
      </details>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked-highlight@2.1.4/lib/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script type="module" src="/frontend/js/main.js"></script>
</body>
</html>
