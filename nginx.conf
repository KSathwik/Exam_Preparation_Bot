worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Slightly above MAX_FILE_SIZE_MB to leave headroom for multipart overhead.
    client_max_body_size 60M;

    upstream exam_prep_api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # The FastAPI app already serves the frontend (/, /frontend/*) and all
        # /api/* routes — nginx here is a plain reverse proxy in front of it,
        # not a static file server (there is no separate frontend build step).
        location / {
            proxy_pass http://exam_prep_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket upgrade for /api/ws
        location /api/ws {
            proxy_pass http://exam_prep_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
    }

    # To terminate TLS here, add a `listen 443 ssl;` server block with your
    # certificate paths and mount the cert/key into this container — that
    # step needs real certificates, so it's left for deployment time.
}
