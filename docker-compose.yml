services:
  # FastAPI Backend
  api:
    build: .
    container_name: exam-prep-bot-api
    ports:
      - "8000:8000"
    # Pulls LLM_PROVIDER, the provider API keys, APP_API_KEY, and every other
    # setting from .env — only the values that must differ inside the
    # container (service hostnames instead of localhost) are overridden below.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://exam_user:${POSTGRES_PASSWORD:-exam_password}@db:5432/exam_prep
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - exam-prep-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database — not published to the host; only `api` needs it,
  # reached over the internal exam-prep-network. Override POSTGRES_PASSWORD
  # via your shell/.env for anything beyond local development.
  db:
    image: postgres:14-alpine
    container_name: exam-prep-db
    environment:
      - POSTGRES_USER=exam_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-exam_password}
      - POSTGRES_DB=exam_prep
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - exam-prep-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache — internal only, same reasoning as `db` above.
  redis:
    image: redis:7-alpine
    container_name: exam-prep-redis
    volumes:
      - redis_data:/data
    networks:
      - exam-prep-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy in front of the API (see nginx.conf) — add a 443
  # server block + certificates here for TLS termination in production.
  nginx:
    image: nginx:alpine
    container_name: exam-prep-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - exam-prep-network
    restart: unless-stopped

networks:
  exam-prep-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
